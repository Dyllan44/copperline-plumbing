<article class="project-card" id="$id" data-project="$category" tabindex="-1" data-reveal>
  <img src="/images/$image-960.jpg" srcset="/images/$image-480.jpg 480w, /images/$image-960.jpg 960w"
    sizes="(max-width: 599px) 92vw, (max-width: 1300px) 46vw, 585px" width="960" height="640"
    loading="lazy" decoding="async" alt="$alt">
  <div class="project-card-content">
    <p class="eyebrow">$label · Illustrative</p>
    <h3>$title</h3>
    <dl>
      <div><dt>Brief</dt><dd>$brief</dd></div>
      <div><dt>Approach</dt><dd>$approach</dd></div>
      <div><dt>Proposed result</dt><dd>$outcome</dd></div>
    </dl>
    <a class="button button-secondary" href="/contact/?service=$category#enquiry">Discuss a similar project</a>
  </div>
</article>
