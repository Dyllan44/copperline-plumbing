<article class="service-card$modifier" id="$slug" tabindex="-1" data-reveal>
  <img src="/images/$image-768.jpg" srcset="/images/$image-384.jpg 384w, /images/$image-768.jpg 768w"
    sizes="$sizes" width="768" height="512" loading="lazy" decoding="async" alt="$alt">
  <div class="card-content">
    <h3>$name</h3>
    <p>$description</p>
    $details
    <a class="button button-secondary" href="$destination">$link_label</a>
  </div>
</article>
