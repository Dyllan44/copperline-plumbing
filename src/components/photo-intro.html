<header class="photo-intro photo-intro--$page">
  <div class="shell photo-intro-inner">
    <p class="eyebrow">$eyebrow</p>
    <h1>$heading</h1>
    <p class="photo-intro-copy">$copy</p>
  </div>
  <div class="photo-intro-media">
    <img src="/images/$image-$width.jpg" srcset="$sources"
      sizes="(max-width: 749px) 100vw, 66vw" width="$width" height="$height"
      fetchpriority="high" alt="$alt">
  </div>
</header>
